name: velio-assessment
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:?Run npm run setup}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Run npm run setup}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
